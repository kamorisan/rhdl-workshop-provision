---
# User configuration
userCount: 10
usernamePrefix: user
namespaceSuffix: -dev

# PostgreSQL configuration
postgresql:
  image: registry.redhat.io/rhel8/postgresql-13:latest
  database: coolstore
  username: coolstore
  password: coolstore123

  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Storage
  storage:
    size: 5Gi

# Sync wave for Argo CD
syncWave: "50"
