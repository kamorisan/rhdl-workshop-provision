{{- $userCount := .Values.workshop.userCount | int }}
{{- $usernamePrefix := .Values.workshop.usernamePrefix }}
{{- $namespaceSuffix := .Values.workshop.namespaceSuffix }}
{{- range $i := until $userCount }}
{{- $userNum := add $i 1 }}
{{- $username := printf "%s%02d" $usernamePrefix $userNum }}
{{- $namespace := printf "%s%s" $username $namespaceSuffix }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: {{ $namespace }}
  labels:
    app: coolstore
    component: database-init
  annotations:
    argocd.argoproj.io/sync-wave: "{{ add ($.Values.syncWave | int) 10 }}"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: coolstore
        component: database-init
    spec:
      restartPolicy: Never
      containers:
      - name: db-init
        image: {{ $.Values.postgresql.image }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h postgresql -U $POSTGRESQL_USER; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done

          echo "PostgreSQL is ready. Initializing database..."

          echo "Running schema creation (idempotent)..."
          psql \
            -v ON_ERROR_STOP=1 \
            -h postgresql \
            -U $POSTGRESQL_USER \
            -d $POSTGRESQL_DATABASE \
            -f /scripts/V1_1__CreateSchema.sql

          echo "Running initial data insert (idempotent)..."
          psql \
            -v ON_ERROR_STOP=1 \
            -h postgresql \
            -U $POSTGRESQL_USER \
            -d $POSTGRESQL_DATABASE \
            -f /scripts/V1_2__AddInitialData.sql

          echo "Verifying required tables exist..."
          REQUIRED_TABLES=(
            inventory
            product_catalog
            orders
            order_items
          )

          for table_name in "${REQUIRED_TABLES[@]}"; do
            exists=$(
              psql \
                -v ON_ERROR_STOP=1 \
                -h postgresql \
                -U $POSTGRESQL_USER \
                -d $POSTGRESQL_DATABASE \
                -Atc "SELECT to_regclass('public.${table_name}') IS NOT NULL"
            )

            if [ "$exists" != "t" ]; then
              echo "ERROR: Required table is missing: ${table_name}"
              exit 1
            fi
            echo "  ✓ Table ${table_name} exists"
          done

          echo "Verifying initial data..."
          product_count=$(
            psql \
              -v ON_ERROR_STOP=1 \
              -h postgresql \
              -U $POSTGRESQL_USER \
              -d $POSTGRESQL_DATABASE \
              -Atc "SELECT COUNT(*) FROM product_catalog"
          )

          inventory_count=$(
            psql \
              -v ON_ERROR_STOP=1 \
              -h postgresql \
              -U $POSTGRESQL_USER \
              -d $POSTGRESQL_DATABASE \
              -Atc "SELECT COUNT(*) FROM inventory"
          )

          if [ "$product_count" -lt 9 ]; then
            echo "ERROR: Expected at least 9 products, found: $product_count"
            exit 1
          fi
          echo "  ✓ PRODUCT_CATALOG has $product_count rows"

          if [ "$inventory_count" -lt 9 ]; then
            echo "ERROR: Expected at least 9 inventory items, found: $inventory_count"
            exit 1
          fi
          echo "  ✓ INVENTORY has $inventory_count rows"

          echo "Verifying hibernate_sequence exists..."
          seq_exists=$(
            psql \
              -v ON_ERROR_STOP=1 \
              -h postgresql \
              -U $POSTGRESQL_USER \
              -d $POSTGRESQL_DATABASE \
              -Atc "SELECT to_regclass('public.hibernate_sequence') IS NOT NULL"
          )

          if [ "$seq_exists" != "t" ]; then
            echo "ERROR: hibernate_sequence is missing"
            exit 1
          fi
          echo "  ✓ hibernate_sequence exists"

          echo "Database initialization completed successfully!"
          echo "Summary:"
          echo "  - All required tables present"
          echo "  - PRODUCT_CATALOG: $product_count rows"
          echo "  - INVENTORY: $inventory_count rows"
          echo "  - Sequence: hibernate_sequence"
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: coolstore-db-secret
              key: DB_USERNAME
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coolstore-db-secret
              key: DB_PASSWORD
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: coolstore-db-secret
              key: DB_NAME
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: coolstore-db-secret
              key: DB_PASSWORD
        volumeMounts:
        - name: init-scripts
          mountPath: /scripts
      volumes:
      - name: init-scripts
        configMap:
          name: db-init-scripts
{{- end }}
