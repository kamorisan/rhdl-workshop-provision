{{- $userCount := .Values.workshop.userCount | int }}
{{- $usernamePrefix := .Values.workshop.usernamePrefix }}
{{- $namespaceSuffix := .Values.workshop.namespaceSuffix }}
{{- range $i := until $userCount }}
{{- $userNum := add $i 1 }}
{{- $username := printf "%s%02d" $usernamePrefix $userNum }}
{{- $namespace := printf "%s%s" $username $namespaceSuffix }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: {{ $namespace }}
  labels:
    app: coolstore
    component: config
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
type: Opaque
stringData:
  DB_HOST: postgresql
  DB_PORT: "5432"
  DB_NAME: {{ $.Values.postgresql.database }}
  DB_USERNAME: {{ $.Values.postgresql.username }}
  DB_PASSWORD: {{ $.Values.postgresql.password }}
{{- end }}
