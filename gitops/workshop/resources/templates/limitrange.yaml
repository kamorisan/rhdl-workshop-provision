{{- range $i := untilStep 1 (add1 .Values.workshop.userCount | int) 1 }}
{{- $id := printf "%02d" $i }}
{{- $username := printf "%s%s" $.Values.workshop.usernamePrefix $id }}
{{- range $suffix := list "-dev" "-devspaces" }}
{{- $namespace := printf "%s%s" $username $suffix }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workshop-limits
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    workshop.user: {{ $username }}
spec:
  limits:
    - type: Pod
      min:
        cpu: {{ $.Values.limitRange.podMinCpu }}
        memory: {{ $.Values.limitRange.podMinMemory }}
      max:
        cpu: {{ $.Values.limitRange.podMaxCpu }}
        memory: {{ $.Values.limitRange.podMaxMemory }}
    - type: Container
      default:
        cpu: {{ $.Values.limitRange.containerDefaultCpu }}
        memory: {{ $.Values.limitRange.containerDefaultMemory }}
      defaultRequest:
        cpu: {{ $.Values.limitRange.containerDefaultCpu }}
        memory: {{ $.Values.limitRange.containerDefaultMemory }}
      max:
        cpu: {{ $.Values.limitRange.containerDefaultLimitCpu }}
        memory: {{ $.Values.limitRange.containerDefaultLimitMemory }}
{{- end }}
{{- end }}
