{{- $userCount := .Values.workshop.userCount | int }}
{{- $usernamePrefix := .Values.workshop.usernamePrefix }}
{{- $namespaceSuffix := .Values.workshop.namespaceSuffix }}
{{- $giteaBaseUrl := .Values.gitea.baseUrl }}
{{- $clusterDomain := .Values.cluster.domain }}
{{- range $i := untilStep 1 (int (add1 $userCount)) 1 }}
{{- $id := printf "%02d" $i }}
{{- $username := printf "%s%s" $usernamePrefix $id }}
{{- $namespace := printf "%s%s" $username $namespaceSuffix }}
{{- $giteaRepoUrl := printf "%s/%s/coolstore-eap7.git" $giteaBaseUrl $username }}
{{- $giteaHost := regexReplaceAll "https?://" $giteaBaseUrl "" }}
---
# Task: git-clone
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    app.kubernetes.io/component: tekton-pipeline
    workshop.user: {{ $username }}
spec:
  params:
    - name: url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      description: Git revision (branch, tag, commit)
      default: main
  workspaces:
    - name: source
      description: The git repository will be cloned here
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: /workspace
      env:
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: gitea-git-secret
              key: username
        - name: GIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitea-git-secret
              key: password
      script: |
        #!/bin/sh
        set -e

        CHECKOUT_DIR="$(workspaces.source.path)"

        echo "Cloning $(params.url) branch $(params.revision) to ${CHECKOUT_DIR}"

        # Clean existing files (not the directory itself)
        rm -rf "${CHECKOUT_DIR}"/* "${CHECKOUT_DIR}"/.[!.]* 2>/dev/null || true

        # Configure git credential helper for HTTPS
        git config --global credential.helper store
        echo "https://${GIT_USERNAME}:${GIT_PASSWORD}@{{ $giteaHost }}" > ~/.git-credentials

        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" "${CHECKOUT_DIR}"

        # Clean credentials
        rm -f ~/.git-credentials

        cd "${CHECKOUT_DIR}"
        echo ""
        echo "Repository cloned successfully:"
        ls -la
        echo ""
        git log -1 --oneline
---
# Task: maven-build
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    app.kubernetes.io/component: tekton-pipeline
    workshop.user: {{ $username }}
spec:
  workspaces:
    - name: source
      description: Workspace containing the source code
  steps:
    - name: build
      image: {{ $.Values.eap8.builderImage }}
      imagePullPolicy: Always
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e

        echo "======================================"
        echo "Maven Build with EAP 8.1"
        echo "======================================"

        # Create Maven settings.xml with Red Hat repositories
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'MAVEN_SETTINGS'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <profiles>
            <profile>
              <id>redhat-repos</id>
              <repositories>
                <repository>
                  <id>redhat-ga</id>
                  <url>https://maven.repository.redhat.com/ga/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>redhat-ga</id>
                  <url>https://maven.repository.redhat.com/ga/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>redhat-repos</activeProfile>
          </activeProfiles>
        </settings>
        MAVEN_SETTINGS

        echo "Maven settings.xml configured with Red Hat repositories"
        echo ""

        mvn clean package -Popenshift -DskipTests

        echo ""
        echo "Build completed. Checking target/server..."
        ls -la target/server/ || echo "WARNING: target/server not found"

        echo ""
        echo "Deployments:"
        ls -la target/server/standalone/deployments/ || echo "No deployments found"
---
# Task: apply-cli
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: apply-cli
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    app.kubernetes.io/component: tekton-pipeline
    workshop.user: {{ $username }}
spec:
  workspaces:
    - name: source
      description: Workspace containing the source code
  steps:
    - name: apply-configuration
      image: {{ $.Values.eap8.runtimeImage }}
      imagePullPolicy: Always
      workingDir: $(workspaces.source.path)
      env:
        - name: JBOSS_HOME
          value: /workspace/source/target/server
      script: |
        #!/bin/bash
        set -e

        echo "======================================"
        echo "Applying CLI Scripts to Provisioned Server"
        echo "======================================"

        SERVER_HOME="$(workspaces.source.path)/target/server"
        CLI="${SERVER_HOME}/bin/jboss-cli.sh"

        if [ ! -d "${SERVER_HOME}" ]; then
          echo "ERROR: ${SERVER_HOME} does not exist"
          ls -la "$(workspaces.source.path)/target/" || true
          exit 1
        fi

        echo "Server found at: ${SERVER_HOME}"
        echo ""

        echo "Starting EAP in admin-only mode..."
        cd "${SERVER_HOME}"
        ./bin/standalone.sh --admin-only &
        EAP_PID=$!

        # Wait for EAP to start
        echo "Waiting for EAP to be ready..."
        for i in {1..60}; do
          if ${CLI} --connect --command=":read-attribute(name=server-state)" 2>/dev/null | grep -q "running"; then
            echo "✓ EAP is ready"
            break
          fi
          echo "Waiting... ($i/60)"
          sleep 3
        done

        # Apply Datasource CLI
        echo ""
        echo "Applying datasource.cli..."
        ${CLI} --connect --file="$(workspaces.source.path)/s2i/eap8-install/configuration/datasource.cli"

        # Apply Messaging CLI (check if messaging-activemq subsystem exists)
        echo ""
        echo "Checking messaging-activemq subsystem..."
        set +e
        MSG_CHECK=$(${CLI} --connect --command="/subsystem=messaging-activemq:read-resource" 2>&1)
        set -e

        if echo "${MSG_CHECK}" | grep -q '"outcome" => "success"'; then
          echo "messaging-activemq subsystem found, applying messaging.cli..."
          ${CLI} --connect --file="$(workspaces.source.path)/s2i/eap8-install/configuration/messaging.cli"
        else
          echo "⚠ messaging-activemq subsystem not found, skipping messaging.cli"
          echo "   This is expected if messaging-activemq layer was not included in Galleon provisioning"
        fi

        # Shutdown EAP
        echo ""
        echo "Shutting down EAP..."
        ${CLI} --connect --command=":shutdown"
        wait ${EAP_PID}

        # Remove build-time configuration history to prevent runtime errors
        HISTORY_DIR="${SERVER_HOME}/standalone/configuration/standalone_xml_history"

        if [ -d "${HISTORY_DIR}" ]; then
            echo ""
            echo "Removing build-time configuration history..."
            rm -rf "${HISTORY_DIR}"
            echo "✓ Configuration history removed"
        fi

        echo ""
        echo "======================================"
        echo "✓ CLI Scripts Applied Successfully"
        echo "======================================"
---
# Task: build-image
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    app.kubernetes.io/component: tekton-pipeline
    workshop.user: {{ $username }}
spec:
  params:
    - name: IMAGE
      type: string
      description: Complete destination image reference
  workspaces:
    - name: source
      description: Workspace containing the generated server and build context

  steps:
    - name: create-containerfile
      image: busybox:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        GENERATED_CONTAINERFILE="Containerfile.eap8.generated"

        echo "======================================"
        echo "Creating Containerfile for EAP 8.1"
        echo "======================================"

        echo ""
        echo "Validating EAP 8 build artifacts..."

        test -d "target/server" || {
          echo "ERROR: target/server does not exist"
          exit 1
        }

        test -f "target/server/bin/standalone.sh" || {
          echo "ERROR: target/server/bin/standalone.sh does not exist"
          exit 1
        }

        test -f \
          "s2i/eap8-install/modules/org/postgresql/main/module.xml" || {
          echo "ERROR: PostgreSQL module.xml does not exist"
          exit 1
        }

        POSTGRESQL_JAR=$(
          find \
            "s2i/eap8-install/modules/org/postgresql/main" \
            -maxdepth 1 \
            -type f \
            -name 'postgresql-*.jar' \
            | head -1
        )

        if [ -z "${POSTGRESQL_JAR}" ]; then
          echo "ERROR: PostgreSQL JDBC Driver JAR does not exist"
          exit 1
        fi

        echo "EAP server: target/server"
        echo "PostgreSQL module: s2i/eap8-install/modules/org/postgresql"
        echo "PostgreSQL JAR: ${POSTGRESQL_JAR}"

        echo ""
        echo "Validating EAP 8 PostgreSQL module dependencies..."
        EAP8_MODULE_XML="s2i/eap8-install/modules/org/postgresql/main/module.xml"

        if grep -Eq \
          'name="javax\.api"|name="javax\.transaction\.api"' \
          "${EAP8_MODULE_XML}"; then
          echo "ERROR: EAP 7 module dependencies were found in the EAP 8 PostgreSQL module.xml"
          exit 1
        fi

        grep -q 'name="java.sql"' "${EAP8_MODULE_XML}" || {
          echo "ERROR: java.sql dependency is missing from the EAP 8 PostgreSQL module.xml"
          exit 1
        }

        grep -q 'name="java.naming"' "${EAP8_MODULE_XML}" || {
          echo "ERROR: java.naming dependency is missing from the EAP 8 PostgreSQL module.xml"
          exit 1
        }

        grep -q 'name="java.management"' "${EAP8_MODULE_XML}" || {
          echo "ERROR: java.management dependency is missing from the EAP 8 PostgreSQL module.xml"
          exit 1
        }

        grep -q 'name="jakarta.transaction.api"' "${EAP8_MODULE_XML}" || {
          echo "ERROR: jakarta.transaction.api dependency is missing from the EAP 8 PostgreSQL module.xml"
          exit 1
        }

        echo "✓ EAP 8 module dependencies validated"

        rm -f "${GENERATED_CONTAINERFILE}"

        cat > "${GENERATED_CONTAINERFILE}" <<'CONTAINERFILE'
        FROM image-registry.openshift-image-registry.svc:5000/workshop-images/eap81-runtime:8.1

        USER root

        # Copy the EAP 8.1 server provisioned by eap-maven-plugin.
        COPY --chown=jboss:root \
          target/server/ \
          /opt/server/

        # Copy the PostgreSQL JDBC custom module.
        COPY --chown=jboss:root \
          s2i/eap8-install/modules/ \
          /opt/server/modules/

        # Support OpenShift arbitrary UID execution.
        RUN chown -R jboss:0 /opt/server && \
            chmod -R g+rwX /opt/server

        EXPOSE 8080

        USER jboss

        CMD ["/opt/server/bin/standalone.sh", "-b", "0.0.0.0"]
        CONTAINERFILE

        echo ""
        echo "Generated Containerfile:"
        echo "--------------------------------------"
        cat "${GENERATED_CONTAINERFILE}"
        echo "--------------------------------------"

        test -s "${GENERATED_CONTAINERFILE}" || {
          echo "ERROR: Generated Containerfile is missing or empty"
          exit 1
        }

        echo ""
        echo "✓ Containerfile generated successfully"

    - name: build-and-push
      image: quay.io/buildah/stable:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/bash
        set -e

        IMAGE="$(params.IMAGE)"
        GENERATED_CONTAINERFILE="Containerfile.eap8.generated"

        echo "======================================"
        echo "Building and Pushing EAP 8.1 Image"
        echo "======================================"
        echo "Image: ${IMAGE}"
        echo "Containerfile: ${GENERATED_CONTAINERFILE}"
        echo ""

        test -s "${GENERATED_CONTAINERFILE}" || {
          echo "ERROR: ${GENERATED_CONTAINERFILE} does not exist"
          exit 1
        }

        buildah bud \
          --format=oci \
          --tls-verify=false \
          --pull=always \
          --no-cache \
          -f "${GENERATED_CONTAINERFILE}" \
          -t "${IMAGE}" \
          .

        echo ""
        echo "Pushing image to registry..."

        buildah push \
          --tls-verify=false \
          "${IMAGE}" \
          "docker://${IMAGE}"

        echo ""
        echo "======================================"
        echo "✓ Image Built and Pushed Successfully"
        echo "======================================"
---
# Task: deploy
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    app.kubernetes.io/component: tekton-pipeline
    workshop.user: {{ $username }}
spec:
  params:
    - name: NAMESPACE
      type: string
      description: Target namespace
      default: {{ $namespace }}
  workspaces:
    - name: source
      description: Workspace containing manifests
  steps:
    - name: apply-manifests
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e

        echo "======================================"
        echo "Deploying to OpenShift"
        echo "Namespace: $(params.NAMESPACE)"
        echo "======================================"

        oc project $(params.NAMESPACE)

        echo ""
        echo "Applying Deployment, Service, Route..."
        oc apply -f openshift/deployment.yaml

        echo ""
        echo "Disabling application-managed Flyway migration..."
        oc set env \
          deployment/coolstore-eap8 \
          RUN_DB_MIGRATION=false

        echo ""
        echo "Restarting Deployment to use the newly pushed image..."
        oc rollout restart deployment/coolstore-eap8

        echo ""
        echo "Waiting for rollout..."
        oc rollout status deployment/coolstore-eap8 --timeout=300s

        echo ""
        echo "Getting Route URL..."
        ROUTE_URL=$(oc get route coolstore-eap8 -o jsonpath='https://{.spec.host}/')

        echo ""
        echo "======================================"
        echo "✓ Deployment Complete"
        echo "Application URL: ${ROUTE_URL}"
        echo "======================================"
---
# Pipeline: coolstore-eap8-pipeline
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: coolstore-eap8-pipeline
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    app.kubernetes.io/component: tekton-pipeline
    workshop.user: {{ $username }}
spec:
  params:
    - name: git-url
      type: string
      description: Git repository URL
      default: {{ $giteaRepoUrl }}
    - name: git-revision
      type: string
      description: Git revision (branch, tag, commit)
      default: main
    - name: image-name
      type: string
      description: Container image name
      default: image-registry.openshift-image-registry.svc:5000/{{ $namespace }}/coolstore-eap8:latest
  workspaces:
    - name: shared-workspace
      description: Shared workspace for pipeline tasks
  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: maven-build
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - git-clone

    - name: apply-cli
      taskRef:
        name: apply-cli
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - maven-build

    - name: build-image
      taskRef:
        name: build-image
      params:
        - name: IMAGE
          value: $(params.image-name)
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - apply-cli

    - name: deploy
      taskRef:
        name: deploy
      params:
        - name: NAMESPACE
          value: {{ $namespace }}
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - build-image
{{- end }}
