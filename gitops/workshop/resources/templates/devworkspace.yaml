{{- range $i := untilStep 1 (add1 .Values.workshop.userCount | int) 1 }}
{{- $id := printf "%02d" $i }}
{{- $username := printf "%s%s" $.Values.workshop.usernamePrefix $id }}
{{- $namespace := printf "%s%s" $username $.Values.workshop.namespaceSuffix }}
---
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: spring-to-quarkus-{{ $username }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    workshop.user: {{ $username }}
spec:
  started: false  # User starts workspace manually
  routingClass: che
  template:
    attributes:
      controller.devfile.io/storage-type: per-workspace
    projects:
      - name: spring-petclinic
        git:
          remotes:
            origin: {{ $.Values.demoApp.repositoryUrl }}
          checkoutFrom:
            revision: {{ $.Values.demoApp.revision }}
    components:
      - name: dev-tools
        container:
          image: quay.io/devfile/universal-developer-image:ubi8-latest
          memoryRequest: {{ $.Values.workspace.memoryRequest }}
          memoryLimit: {{ $.Values.workspace.memoryLimit }}
          cpuRequest: {{ $.Values.workspace.cpuRequest }}
          cpuLimit: {{ $.Values.workspace.cpuLimit }}
          mountSources: true
          volumeMounts:
            - name: m2
              path: /home/user/.m2
          env:
            - name: MAVEN_OPTS
              value: "-Xmx1g"
            - name: MTA_SOLUTION_SERVER_URL
              value: {{ $.Values.mta.solutionServerUrl | quote }}
      - name: m2
        volume:
          size: {{ $.Values.workspace.storage }}
    commands:
      - id: maven-build
        exec:
          component: dev-tools
          commandLine: mvn clean package -DskipTests
          workingDir: ${PROJECT_SOURCE}/spring-petclinic
      - id: maven-test
        exec:
          component: dev-tools
          commandLine: mvn test
          workingDir: ${PROJECT_SOURCE}/spring-petclinic
      - id: run-app
        exec:
          component: dev-tools
          commandLine: mvn spring-boot:run
          workingDir: ${PROJECT_SOURCE}/spring-petclinic
      - id: mta-analyze
        exec:
          component: dev-tools
          commandLine: echo "Use MTA VS Code extension to analyze the project"
          workingDir: ${PROJECT_SOURCE}/spring-petclinic
{{- end }}
