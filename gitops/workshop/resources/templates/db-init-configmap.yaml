{{- $userCount := .Values.workshop.userCount | int }}
{{- $usernamePrefix := .Values.workshop.usernamePrefix }}
{{- $namespaceSuffix := .Values.workshop.namespaceSuffix }}
{{- range $i := until $userCount }}
{{- $userNum := add $i 1 }}
{{- $username := printf "%s%02d" $usernamePrefix $userNum }}
{{- $namespace := printf "%s%s" $username $namespaceSuffix }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  namespace: {{ $namespace }}
  labels:
    app: coolstore
    component: database
  annotations:
    argocd.argoproj.io/sync-wave: "{{ $.Values.syncWave }}"
data:
  V1_1__CreateSchema.sql: |
    -- Idempotent schema creation for Coolstore database
    -- Safe to run multiple times, preserves existing tables and data

    CREATE TABLE IF NOT EXISTS INVENTORY (
        itemId varchar(255) not null,
        link varchar(255),
        location varchar(255),
        quantity int4,
        primary key (itemId)
    );

    CREATE TABLE IF NOT EXISTS ORDERS (
        orderId int8 not null,
        customerEmail varchar(255),
        customerName varchar(255),
        discount float8 not null,
        orderValue float8 not null,
        retailPrice float8 not null,
        shippingDiscount float8 not null,
        shippingFee float8 not null,
        primary key (orderId)
    );

    CREATE TABLE IF NOT EXISTS ORDER_ITEMS (
        ID int8 not null,
        productId varchar(255),
        quantity int4 not null,
        ORDER_ID int8,
        primary key (ID)
    );

    CREATE TABLE IF NOT EXISTS PRODUCT_CATALOG (
        itemId varchar(255) not null,
        description text,
        name varchar(80),
        price float8,
        primary key (itemId)
    );

    -- Add foreign key constraint only if it doesn't exist
    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1
            FROM pg_constraint
            WHERE conname = 'fk2bff474f65938e8'
              AND contype = 'f'
        ) THEN
            ALTER TABLE ORDER_ITEMS
                ADD CONSTRAINT FK2BFF474F65938E8
                FOREIGN KEY (ORDER_ID)
                REFERENCES ORDERS;
        END IF;
    END
    $$;

    CREATE SEQUENCE IF NOT EXISTS hibernate_sequence;

