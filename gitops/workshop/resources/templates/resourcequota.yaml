{{- range $i := untilStep 1 (add1 .Values.workshop.userCount | int) 1 }}
{{- $id := printf "%02d" $i }}
{{- $username := printf "%s%s" $.Values.workshop.usernamePrefix $id }}
{{- $namespace := printf "%s%s" $username $.Values.workshop.namespaceSuffix }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
    workshop.user: {{ $username }}
spec:
  hard:
    pods: {{ $.Values.resourceQuota.pods | quote }}
    services: {{ $.Values.resourceQuota.services | quote }}
    persistentvolumeclaims: {{ $.Values.resourceQuota.persistentVolumeClaims | quote }}
    requests.cpu: {{ $.Values.resourceQuota.requestsCpu | quote }}
    requests.memory: {{ $.Values.resourceQuota.requestsMemory }}
    limits.cpu: {{ $.Values.resourceQuota.limitsCpu | quote }}
    limits.memory: {{ $.Values.resourceQuota.limitsMemory }}
{{- end }}
