---
# Grant ArgoCD Application Controller admin access to workshop-images namespace
# This allows ArgoCD to manage all resources in the namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-controller-admin
  namespace: workshop-images
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: application-controller
    app.kubernetes.io/part-of: developer-lightspeed-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "5"
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: admin
