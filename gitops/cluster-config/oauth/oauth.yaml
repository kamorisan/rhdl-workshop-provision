---
# OAuth CR - GitOps manages the desired state
# The htpasswd Secret is created by Ansible
# This CR references the Secret but does not manage it
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
    argocd.argoproj.io/sync-options: ServerSideApply=true,RespectIgnoreDifferences=true
spec:
  identityProviders:
    - name: workshop_htpasswd
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: workshop-htpasswd
