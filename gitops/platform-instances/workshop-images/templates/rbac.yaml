---
# ServiceAccount for image mirror operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-mirror-sa
  namespace: workshop-images
  labels:
    app.kubernetes.io/name: image-mirror
    app.kubernetes.io/component: image-mirror
    app.kubernetes.io/part-of: developer-lightspeed-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
# Role for managing BuildConfigs and Builds
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-mirror-manager
  namespace: workshop-images
  labels:
    app.kubernetes.io/name: image-mirror
    app.kubernetes.io/component: image-mirror
    app.kubernetes.io/part-of: developer-lightspeed-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
- apiGroups:
  - build.openshift.io
  resources:
  - buildconfigs
  - builds
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - build.openshift.io
  resources:
  - buildconfigs/instantiate
  verbs:
  - create
---
# RoleBinding for image-mirror-sa
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-mirror-manager
  namespace: workshop-images
  labels:
    app.kubernetes.io/name: image-mirror
    app.kubernetes.io/component: image-mirror
    app.kubernetes.io/part-of: developer-lightspeed-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "5"
subjects:
- kind: ServiceAccount
  name: image-mirror-sa
  namespace: workshop-images
- kind: ServiceAccount
  name: default
  namespace: workshop-images
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: image-mirror-manager
