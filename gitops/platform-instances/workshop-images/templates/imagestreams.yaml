---
# ImageStream for EAP 8.1 Builder
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: eap81-builder
  namespace: workshop-images
  labels:
    app.kubernetes.io/name: eap81-builder
    app.kubernetes.io/component: image-mirror
    app.kubernetes.io/part-of: developer-lightspeed-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  lookupPolicy:
    local: false
  tags:
    - name: "8.1"
      from:
        kind: DockerImage
        name: registry.redhat.io/jboss-eap-8/eap8-openjdk17-builder-openshift-rhel8:8.1
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Source
