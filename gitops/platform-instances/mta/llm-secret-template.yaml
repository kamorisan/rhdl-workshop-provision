---
# LLM Secret Template
# This file is a TEMPLATE ONLY - do NOT commit actual API keys to Git
#
# For production deployment, use one of:
# 1. External Secrets Operator
# 2. Sealed Secrets
# 3. Manual creation with: oc create secret generic mta-llm-secret -n openshift-mta --from-literal=OPENAI_API_KEY=<key>
#
# To create this secret manually:
#   oc create secret generic mta-llm-secret \
#     -n openshift-mta \
#     --from-literal=OPENAI_API_KEY=<your-api-key-here>
#
# After creating the secret, uncomment the kai_* fields in tackle.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mta-llm-secret
  namespace: openshift-mta
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: developer-lightspeed-workshop
type: Opaque
stringData:
  # REPLACE THIS VALUE - DO NOT COMMIT REAL KEYS
  OPENAI_API_KEY: "REPLACE_WITH_YOUR_ACTUAL_API_KEY"
