---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-user-provisioning
  namespace: gitea
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-user-provisioning
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision-users
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -ec
          args:
            - |
              chmod +x /scripts/provision-users.sh
              /scripts/provision-users.sh
          env:
            - name: GITEA_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-user-provisioning
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-user-provisioning
                  key: admin-password
            - name: WORKSHOP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-user-provisioning
                  key: workshop-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      volumes:
        - name: scripts
          configMap:
            name: gitea-user-provisioning-script
            defaultMode: 0555
