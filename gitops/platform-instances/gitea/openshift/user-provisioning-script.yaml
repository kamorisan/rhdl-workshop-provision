---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-user-provisioning-script
  namespace: gitea
data:
  provision-users.sh: |
    #!/usr/bin/env sh
    set -eu

    GITEA_URL="${GITEA_URL%/}"

    echo "Waiting for Gitea API..."

    until curl --fail --silent --show-error \
      "${GITEA_URL}/api/v1/version" >/dev/null; do
      sleep 5
    done

    echo "Gitea API is ready. Creating workshop users..."

    i=1
    while [ "$i" -le 10 ]; do
      username="$(printf 'user%02d' "$i")"
      email="${username}@workshop.local"

      status="$(
        curl --silent \
          --output /tmp/user.json \
          --write-out '%{http_code}' \
          --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
          "${GITEA_URL}/api/v1/users/${username}"
      )"

      if [ "$status" = "200" ]; then
        echo "${username} already exists"
      else
        echo "Creating ${username}"

        curl --fail --silent --show-error \
          --request POST \
          --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
          --header 'Content-Type: application/json' \
          --data "{
            \"username\": \"${username}\",
            \"email\": \"${email}\",
            \"password\": \"${WORKSHOP_PASSWORD}\",
            \"must_change_password\": false,
            \"send_notify\": false,
            \"visibility\": \"private\"
          }" \
          "${GITEA_URL}/api/v1/admin/users"
      fi

      i=$((i + 1))
    done

    echo "Gitea workshop users (user01-user10) are ready."
