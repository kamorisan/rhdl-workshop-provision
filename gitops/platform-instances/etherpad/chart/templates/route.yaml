---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.etherpad.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.etherpad.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWave }}"
spec:
  to:
    kind: Service
    name: {{ .Values.etherpad.name }}
  port:
    targetPort: {{ .Values.etherpad.name }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
