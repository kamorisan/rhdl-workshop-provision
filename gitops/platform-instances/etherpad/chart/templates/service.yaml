---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.etherpad.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.etherpad.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWave }}"
spec:
  ports:
    - name: {{ .Values.etherpad.name }}
      port: 9001
      protocol: TCP
      targetPort: 9001
  selector:
    app: {{ .Values.etherpad.name }}
    deploymentconfig: {{ .Values.etherpad.name }}
  type: ClusterIP
