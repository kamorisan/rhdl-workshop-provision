---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: eap-operator-group
  namespace: openshift-eap
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
spec:
  # Empty targetNamespaces = All Namespaces mode
  # This allows EAP operator to manage resources in any namespace (e.g., user01-dev)
  targetNamespaces: []
