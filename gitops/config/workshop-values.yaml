---
# Workshop Configuration Values
# This file is referenced by Helm charts for user namespaces and resources

# Cluster Configuration
cluster:
  domain: apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com
  ingressDomain: apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com

# Gitea Configuration
gitea:
  baseUrl: https://gitea-gitea.apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com

workshop:
  userCount: 10
  usernamePrefix: user
  namespaceSuffix: -dev

demoApp:
  repositoryUrl: https://github.com/kamorisan/spring-to-quarkus-sample
  revision: main
  workMode: readonly  # readonly, per_user_branch, fork

migration:
  source: springboot
  target: quarkus

devspaces:
  dashboardUrl: https://devspaces.apps.example.com

mta:
  namespace: openshift-mta
  solutionServerUrl: https://mta-solution-server-openshift-mta.apps.example.com

workspace:
  cpuRequest: "500m"
  cpuLimit: "2000m"
  memoryRequest: "2Gi"
  memoryLimit: "4Gi"
  storage: "10Gi"
  autoStopTimeoutMinutes: 60

resourceQuota:
  pods: "10"
  services: "5"
  persistentVolumeClaims: "5"
  requestsCpu: "4"
  requestsMemory: "16Gi"
  limitsCpu: "4"
  limitsMemory: "32Gi"

limitRange:
  podMinCpu: "100m"
  podMaxCpu: "4000m"
  podMinMemory: "128Mi"
  podMaxMemory: "16Gi"
  containerDefaultCpu: "500m"
  containerDefaultMemory: "1Gi"
  containerDefaultLimitCpu: "2000m"
  containerDefaultLimitMemory: "8Gi"

postgresql:
  image: registry.redhat.io/rhel8/postgresql-13:latest
  database: coolstore
  username: coolstore
  password: coolstore123
  storageSize: 5Gi

# EAP 8.1 Tekton Pipeline Configuration
tekton:
  pipelineWorkspaceSize: 2Gi
  storageClassName: gp3-csi

# EAP 8.1 Runtime Configuration
eap8:
  builderImage: image-registry.openshift-image-registry.svc:5000/workshop-images/eap81-builder:8.1
  runtimeImage: image-registry.openshift-image-registry.svc:5000/workshop-images/eap81-runtime:8.1
  # Note: ImageStream rebuilt to remove arm64 image history
  # Only amd64 images exist now - safe to use :8.1 tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

syncWave: "40"
