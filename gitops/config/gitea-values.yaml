---
# Gitea Helm Chart Values for OpenShift Workshop
# Chart version: 12.6.0

strategy:
  type: Recreate

replicaCount: 1

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

ingress:
  enabled: false  # Use OpenShift Route instead

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  # StorageClass will use cluster default (gp3-csi)

gitea:
  admin:
    existingSecret: gitea-admin-secret

  config:
    server:
      PROTOCOL: http
      HTTP_PORT: 3000
      DOMAIN: gitea.apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com
      ROOT_URL: https://gitea.apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com/
      SSH_DOMAIN: gitea.apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com
      DISABLE_SSH: true  # Disable SSH to simplify setup

    service:
      DISABLE_REGISTRATION: true  # Disable self-registration
      REQUIRE_SIGNIN_VIEW: true
      DEFAULT_ALLOW_CREATE_ORGANIZATION: false

    repository:
      DEFAULT_PRIVATE: private
      ENABLE_PUSH_CREATE_USER: false
      ENABLE_PUSH_CREATE_ORG: false

    security:
      INSTALL_LOCK: true

    session:
      PROVIDER: db

    database:
      DB_TYPE: sqlite3  # Use SQLite for workshop (10 users)

# Security context for OpenShift restricted-v2 SCC
# Using containerSecurityContext instead of securityContext
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: null  # Let OpenShift assign dynamic UID
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Pod security context - leave empty for OpenShift dynamic UID/GID
podSecurityContext:
  fsGroup: null  # Let OpenShift assign dynamic GID

# Disable all external dependencies
valkey:
  enabled: false

valkey-cluster:
  enabled: false

redis-cluster:
  enabled: false

postgresql:
  enabled: false

postgresql-ha:
  enabled: false
