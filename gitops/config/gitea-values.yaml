---
# Gitea Helm Chart Values for OpenShift Workshop
# Chart version: 12.6.0

strategy:
  type: Recreate

replicaCount: 1

# Enable Gitea Helm Chart OpenShift compatibility
# This prevents the chart from using fixed UID/GID (1000) and ensures
# it renders manifests compatible with OpenShift restricted-v2 SCC
openshift:
  enabled: true

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

ingress:
  enabled: false  # Use OpenShift Route instead

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

gitea:
  admin:
    existingSecret: gitea-admin-secret

  config:
    server:
      PROTOCOL: http
      HTTP_PORT: 3000
      DOMAIN: gitea.apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com
      ROOT_URL: https://gitea.apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com/
      SSH_DOMAIN: gitea.apps.cluster-jxznt.jxznt.sandbox3409.opentlc.com
      DISABLE_SSH: true

    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: false  # Allow anonymous read access for public repos
      DEFAULT_ALLOW_CREATE_ORGANIZATION: false

    repository:
      DEFAULT_PRIVATE: private
      ENABLE_PUSH_CREATE_USER: false
      ENABLE_PUSH_CREATE_ORG: false

    security:
      INSTALL_LOCK: true

    session:
      PROVIDER: db

    database:
      DB_TYPE: sqlite3

# Disable all external dependencies (SQLite single-pod configuration)
valkey:
  enabled: false

valkey-cluster:
  enabled: false

redis-cluster:
  enabled: false

postgresql:
  enabled: false

postgresql-ha:
  enabled: false
