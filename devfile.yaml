schemaVersion: 2.3.0
metadata:
  name: spring-to-quarkus-workshop
  displayName: Spring to Quarkus Migration Workshop
  description: Workshop environment for migrating Spring Boot to Quarkus with auto OpenShift login
  language: java
  projectType: maven
  tags:
    - Java
    - Spring Boot
    - Quarkus
    - Migration
  version: 1.0.0

projects:
  - name: spring-to-quarkus-sample
    git:
      remotes:
        origin: https://github.com/kamorisan/spring-to-quarkus-sample
      checkoutFrom:
        revision: main

components:
  - name: dev-tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryRequest: 2Gi
      memoryLimit: 8Gi
      cpuRequest: 500m
      cpuLimit: 2000m
      mountSources: true
      sourceMapping: /projects
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      env:
        - name: MAVEN_OPTS
          value: "-Xmx2g"
        # OpenShift API URL for auto-login
        - name: OCP_API_URL
          value: "https://api.cluster-59m78.59m78.sandbox1272.opentlc.com:6443"

  - name: m2
    volume:
      size: 10Gi

commands:
  # Auto-login to OpenShift on workspace start
  - id: oc-auto-login
    exec:
      component: dev-tools
      commandLine: |
        #!/bin/bash
        set -e

        # Get username from workspace namespace (e.g., user01-devspaces -> user01)
        USERNAME=$(echo "${DEVWORKSPACE_NAMESPACE}" | sed 's/-devspaces$//')
        PASSWORD="openshift"

        echo "🔐 Auto-login to OpenShift as ${USERNAME}..."

        if oc login --insecure-skip-tls-verify=true \
          "${OCP_API_URL}" \
          -u "${USERNAME}" \
          -p "${PASSWORD}" >/dev/null 2>&1; then
          echo "✅ Logged in as ${USERNAME}"
          echo "   Current project: $(oc project -q)"
          echo ""
          echo "You can now use 'oc' commands without manual login!"
        else
          echo "⚠️  Auto-login failed. You can manually login with:"
          echo "   oc login --insecure-skip-tls-verify=true ${OCP_API_URL} -u ${USERNAME} -p openshift"
        fi
      workingDir: ${PROJECT_SOURCE}
      label: "Auto-login to OpenShift"
      group:
        kind: run
        isDefault: false

  - id: maven-build
    exec:
      component: dev-tools
      commandLine: mvn clean package -DskipTests
      workingDir: ${PROJECT_SOURCE}/spring-to-quarkus-sample
      label: "Build"
      group:
        kind: build
        isDefault: true

  - id: maven-test
    exec:
      component: dev-tools
      commandLine: mvn test
      workingDir: ${PROJECT_SOURCE}/spring-to-quarkus-sample
      label: "Test"
      group:
        kind: test

  - id: run-app
    exec:
      component: dev-tools
      commandLine: mvn spring-boot:run
      workingDir: ${PROJECT_SOURCE}/spring-to-quarkus-sample
      label: "Run Application"
      group:
        kind: run
        isDefault: true

events:
  # Execute auto-login after workspace starts
  postStart:
    - oc-auto-login
