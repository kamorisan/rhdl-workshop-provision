schemaVersion: 2.3.0
metadata:
  name: spring-to-quarkus-workshop
  displayName: Spring to Quarkus Migration Workshop
  description: Workshop environment for migrating Spring Boot to Quarkus with auto OpenShift login
  language: java
  projectType: maven
  tags:
    - Java
    - Spring Boot
    - Quarkus
    - Migration
  version: 1.0.0

projects:
  - name: spring-to-quarkus-sample
    git:
      remotes:
        origin: https://github.com/kamorisan/spring-to-quarkus-sample
      checkoutFrom:
        revision: main

  - name: workshop-config
    git:
      remotes:
        origin: https://github.com/kamorisan/rhdl-workshop-provision
      checkoutFrom:
        revision: main

components:
  - name: dev-tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryRequest: 2Gi
      memoryLimit: 8Gi
      cpuRequest: 500m
      cpuLimit: 2000m
      mountSources: true
      sourceMapping: /projects
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      env:
        - name: MAVEN_OPTS
          value: "-Xmx2g"

  - name: m2
    volume:
      size: 10Gi

commands:
  - id: oc-auto-login
    exec:
      component: dev-tools
      commandLine: |
        #!/bin/bash
        USERNAME=$(echo "${DEVWORKSPACE_NAMESPACE}" | sed 's/-dev$//')
        OCP_API=$(oc whoami --show-server 2>/dev/null || echo "https://kubernetes.default.svc")

        if oc login --insecure-skip-tls-verify=true "$OCP_API" -u "$USERNAME" -p "openshift" >/dev/null 2>&1; then
          echo "✅ Logged in as $USERNAME"
        else
          echo "⚠️ Auto-login skipped"
        fi
        exit 0
      workingDir: ${PROJECT_SOURCE}
      label: "Auto-login to OpenShift"
      group:
        kind: run
        isDefault: false

  - id: setup-mta-config
    exec:
      component: dev-tools
      commandLine: |
        #!/bin/bash
        SETTINGS_DIR="/checode/remote/data/User/globalStorage/redhat.mta-core/settings"
        TEMPLATE_FILE="/projects/workshop-config/.devspaces/provider-settings-template.yaml"

        mkdir -p "$SETTINGS_DIR"

        # Wait for project to be cloned (max 30 seconds)
        for i in {1..30}; do
          if [ -f "$TEMPLATE_FILE" ]; then
            cp -f "$TEMPLATE_FILE" "$SETTINGS_DIR/provider-settings.yaml"
            echo "✅ MTA provider settings configured"
            exit 0
          fi
          sleep 1
        done

        echo "⚠️ Template file not ready yet, skipping MTA config"
        exit 0
      workingDir: /projects
      label: "Setup MTA Configuration"
      group:
        kind: run
        isDefault: false

  - id: maven-build
    exec:
      component: dev-tools
      commandLine: mvn clean package -DskipTests
      workingDir: ${PROJECT_SOURCE}/spring-to-quarkus-sample
      label: "Build"
      group:
        kind: build
        isDefault: true

  - id: maven-test
    exec:
      component: dev-tools
      commandLine: mvn test
      workingDir: ${PROJECT_SOURCE}/spring-to-quarkus-sample
      label: "Test"
      group:
        kind: test

  - id: run-app
    exec:
      component: dev-tools
      commandLine: mvn spring-boot:run
      workingDir: ${PROJECT_SOURCE}/spring-to-quarkus-sample
      label: "Run Application"
      group:
        kind: run
        isDefault: true

events:
  postStart:
    - oc-auto-login
    - setup-mta-config
