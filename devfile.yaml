schemaVersion: 2.2.0
metadata:
  name: spring-to-quarkus
  displayName: Spring to Quarkus Migration Workshop
  description: Workshop environment for migrating Spring Boot applications to Quarkus
  tags:
    - Java
    - Spring Boot
    - Quarkus
    - Migration
  projectType: maven
  language: java
  version: 1.0.0

projects:
  - name: spring-petclinic
    git:
      remotes:
        origin: https://github.com/kamorisan/spring-to-quarkus-sample
      checkoutFrom:
        revision: main

components:
  - name: dev-tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryRequest: 2Gi
      memoryLimit: 4Gi
      cpuRequest: 500m
      cpuLimit: 2000m
      mountSources: true
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      env:
        - name: MAVEN_OPTS
          value: "-Xmx1g"

  - name: m2
    volume:
      size: 10Gi

commands:
  - id: maven-build
    exec:
      component: dev-tools
      commandLine: mvn clean package -DskipTests
      workingDir: ${PROJECT_SOURCE}/spring-petclinic
      label: "Build"
      group:
        kind: build
        isDefault: true

  - id: maven-test
    exec:
      component: dev-tools
      commandLine: mvn test
      workingDir: ${PROJECT_SOURCE}/spring-petclinic
      label: "Test"
      group:
        kind: test

  - id: run-app
    exec:
      component: dev-tools
      commandLine: mvn spring-boot:run
      workingDir: ${PROJECT_SOURCE}/spring-petclinic
      label: "Run Application"
      group:
        kind: run
        isDefault: true
