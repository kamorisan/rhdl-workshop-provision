---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coolstore-postgresql-data
  namespace: user01-dev
  labels:
    app.kubernetes.io/name: coolstore-postgresql
    app.kubernetes.io/part-of: coolstore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coolstore-postgresql
  namespace: user01-dev
  labels:
    app.kubernetes.io/name: coolstore-postgresql
    app.kubernetes.io/part-of: coolstore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: coolstore-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coolstore-postgresql
  namespace: user01-dev
  labels:
    app.kubernetes.io/name: coolstore-postgresql
    app.kubernetes.io/part-of: coolstore
spec:
  serviceName: coolstore-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coolstore-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coolstore-postgresql
        app.kubernetes.io/part-of: coolstore
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: coolstore-postgresql-secret
                  key: database-name
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: coolstore-postgresql-secret
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-postgresql-secret
                  key: database-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -U "${POSTGRESQL_USER}" -d "${POSTGRESQL_DATABASE}"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -U "${POSTGRESQL_USER}" -d "${POSTGRESQL_DATABASE}"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coolstore-postgresql-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coolstore-postgresql-init
  namespace: user01-dev
  labels:
    app.kubernetes.io/name: coolstore-postgresql-init
    app.kubernetes.io/part-of: coolstore
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coolstore-postgresql-init
        app.kubernetes.io/part-of: coolstore
    spec:
      restartPolicy: OnFailure
      containers:
        - name: initialize-database
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: coolstore-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: coolstore-postgresql-secret
                  key: database-name
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: coolstore-postgresql-secret
                  key: database-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-postgresql-secret
                  key: database-password
          command:
            - /bin/bash
            - -ec
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
                sleep 3
              done

              INITIALIZED="$(psql -tA -v ON_ERROR_STOP=1 \
                -c "SELECT CASE WHEN to_regclass('public.product_catalog') IS NULL THEN 'false' ELSE 'true' END;")"

              if [ "$INITIALIZED" = "true" ]; then
                echo "Coolstore schema already exists; initialization is skipped."
                exit 0
              fi

              echo "Applying V1_1__CreateSchema.sql..."
              psql -v ON_ERROR_STOP=1 -f /migration/V1_1__CreateSchema.sql

              echo "Applying V1_2__AddInitialData.sql..."
              psql -v ON_ERROR_STOP=1 -f /migration/V1_2__AddInitialData.sql

              echo "Database initialization completed."
          volumeMounts:
            - name: migration-sql
              mountPath: /migration
              readOnly: true
      volumes:
        - name: migration-sql
          configMap:
            name: coolstore-postgresql-init-sql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coolstore-postgresql-ingress
  namespace: user01-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coolstore-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
