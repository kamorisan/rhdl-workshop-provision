# MTA Provider Settings Template
# This file is copied to workspace at startup
---
environment:
  ALWAYS_APPLIED_KEY: "envvar to be set regardless of which model is active"

models:
  OpenAI: &active
    environment:
      OPENAI_API_KEY: "sk-k6yUFWReBsfsLzDmPWFn9w"
    provider: ChatOpenAI
    args:
      model: gpt-oss-120b
      configuration:
        baseURL: https://maas-rhdp.apps.maas.redhatworkshops.io/v1

  AzureChatOpenAI:
    environment:
      AZURE_OPENAI_API_KEY: ""
    provider: AzureChatOpenAI
    args:
      azureOpenAIApiDeploymentName: ""
      azureOpenAIApiVersion: ""

  AmazonBedrock:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_DEFAULT_REGION: ""
    provider: ChatBedrock
    args:
      model: meta.llama3-70b-instruct-v1:0

  DeepSeek:
    environment:
      DEEPSEEK_API_KEY: ""
    provider: ChatDeepSeek
    args:
      model: deepseek-chat

  GoogleGenAI:
    environment:
      GOOGLE_API_KEY: ""
    provider: ChatGoogleGenerativeAI
    args:
      model: gemini-2.5-pro

  ChatOllama:
    provider: ChatOllama
    args:
      model: your-model-here

  JustAnExample:
    environment:
      ANY_KEY_1: "any environment variable needed for this model provider"
      ANY_KEY_2: "any environment variable needed for this model provider"
    provider: "provider-string"
    args:
      anyArgumentName1: "argument one"
      anyArgumentName2: "argument two"
      any-argument-name-3: "argument three"
    template: "template string"
    llamaHeader: "header string"
    llmRetries: 5
    llmRetryDelay: 10.0

active: *active
