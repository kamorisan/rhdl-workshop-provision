---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    # OpenShift Cluster
    cluster_api_url: "https://api.example.openshift.com:6443"
    cluster_validate_certs: true

    # Workshop Configuration
    workshop_user_count: 10

    # Demo Application
    demo_repository_url: "https://github.com/kamorisan/spring-to-quarkus-sample"
    demo_repository_revision: "main"

    # Migration Configuration
    migration_source: "springboot"
    migration_target: "quarkus"

    # GitOps Repository
    gitops_repo_url: "https://github.com/your-org/workshop-provisioning.git"
    gitops_repo_revision: "main"

    # LLM Configuration
    llm_provider: "openai"
    llm_model: "gpt-4"
    llm_api_base: "https://api.openai.com/v1"
    # llm_api_key is in vault.yml as vault_llm_api_key

    # Operator Channels (verify on your cluster)
    devspaces_channel: "stable"
    mta_channel: "stable"

    # Storage
    # Leave empty to use default StorageClass
    storage_class_name: ""

    # Resource Limits (per workspace)
    workspace_cpu_request: "500m"
    workspace_cpu_limit: "2000m"
    workspace_memory_request: "2Gi"
    workspace_memory_limit: "8Gi"
    workspace_storage: "10Gi"

    # Solution Server
    solution_server_enabled: true
    solution_server_storage: "5Gi"

    # PVC Retention
    retain_solution_server_pvc: false
    retain_workspace_pvc: false

    # Network Policy
    network_policy_enabled: false
