---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    # OpenShift Cluster
    cluster_api_url: "https://api.cluster-59m78.59m78.sandbox1272.opentlc.com:6443"
    cluster_validate_certs: false  # Self-signed cert対応

    # Workshop Configuration (テスト用: 2ユーザー)
    workshop:
      user_count: 2
      username_prefix: "user"
      namespace_suffix: "-dev"
      password_mode: "fixed"  # Use fixed password "openshift" for testing
      fixed_password: "openshift"
      password_length: 16
      credentials_output: "./artifacts/workshop-users.csv"
      prune_users: false

    # Demo Application
    demo_repository_url: "https://github.com/kamorisan/spring-to-quarkus-sample"
    demo_repository_revision: "main"
    demo_repository_private: false

    # Migration Configuration
    migration_source: "springboot"
    migration_target: "quarkus"

    # GitOps Repository
    gitops:
      operator_namespace: "openshift-gitops-operator"
      instance_namespace: "openshift-gitops"
      operator_channel: "latest"
      install_plan_approval: "Automatic"
      repo_url: "https://github.com/kamorisan/rhdl-workshop-provision.git"
      repo_revision: "main"
      repo_path: "gitops/bootstrap"
      auth_type: "none"

    # LLM Configuration
    # テスト用: Solution Serverを無効化する場合はsolution_server_enabled: falseを設定
    llm:
      provider: "openai"
      model: "gpt-4"
      api_base: "https://api.openai.com/v1"

    # OpenShift Dev Spaces
    devspaces:
      operator_namespace: "openshift-devspaces"
      channel: "stable"
      install_plan_approval: "Automatic"
      workspace_storage: "10Gi"
      cpu_request: "500m"
      cpu_limit: "2000m"
      memory_request: "2Gi"
      memory_limit: "8Gi"
      auto_stop_timeout_minutes: 60

    # Migration Toolkit for Applications
    mta:
      operator_namespace: "openshift-mta"
      channel: "stable-v8.1"
      install_plan_approval: "Automatic"
      instance_namespace: "openshift-mta"
      solution_server_enabled: false
      solution_server_storage: "5Gi"
      solution_server_db_storage: "5Gi"

    # PVC Retention (テスト用: 削除)
    retain_solution_server_pvc: false
    retain_workspace_pvc: false

    # Network Policy (テスト用: 無効)
    network_policy_enabled: false
