---
# HTPasswd Users defaults (can be overridden by group_vars)
workshop:
  user_count: 10
  username_prefix: "user"
  namespace_suffix: "-dev"
  password_mode: "generated"  # "generated", "provided", or "fixed"
  password_length: 16
  fixed_password: "openshift"  # Used when password_mode is "fixed"
  credentials_output: "./artifacts/workshop-users.csv"
  prune_users: true
