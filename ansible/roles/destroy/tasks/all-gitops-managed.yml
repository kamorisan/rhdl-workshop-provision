---
# Destroy scope: all-gitops-managed
# Deletes all GitOps-managed resources including Operators

- name: Include platform destroy tasks
  ansible.builtin.include_tasks: platform.yml

- name: Delete workshop-cluster-config Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: workshop-cluster-config
    namespace: "{{ gitops.instance_namespace }}"
    validate_certs: "{{ cluster_validate_certs }}"
  ignore_errors: true

- name: Delete workshop-operators Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: workshop-operators
    namespace: "{{ gitops.instance_namespace }}"
    validate_certs: "{{ cluster_validate_certs }}"
  ignore_errors: true

- name: Wait for Operators deletion
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: devspaces
    namespace: "{{ devspaces.operator_namespace }}"
    validate_certs: "{{ cluster_validate_certs }}"
  register: devspaces_sub
  until: devspaces_sub.resources | length == 0
  retries: 60
  delay: 10
  ignore_errors: true

- name: Delete operator namespaces (if not cleaned up by GitOps)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    validate_certs: "{{ cluster_validate_certs }}"
  loop:
    - "{{ devspaces.operator_namespace }}"
    - "{{ mta.instance_namespace }}"
  ignore_errors: true

- name: Display all-gitops-managed destroy completion
  ansible.builtin.debug:
    msg:
      - "All GitOps-managed resources destroyed:"
      - "  - Platform resources"
      - "  - Dev Spaces Operator"
      - "  - MTA Operator"
      - "  - Cluster configuration (OAuth preserved if other IdPs exist)"
