---
# Destroy scope: platform
# Deletes workshop + Dev Spaces + MTA instances

- name: Include workshop destroy tasks
  ansible.builtin.include_tasks: workshop.yml

- name: Delete workshop-platform-instances Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: workshop-platform-instances
    namespace: "{{ gitops.instance_namespace }}"
    validate_certs: "{{ cluster_validate_certs }}"
  ignore_errors: true

- name: Wait for platform instances deletion
  kubernetes.core.k8s_info:
    api_version: org.eclipse.che/v2
    kind: CheCluster
    name: devspaces
    namespace: "{{ devspaces.operator_namespace }}"
    validate_certs: "{{ cluster_validate_certs }}"
  register: checluster
  until: checluster.resources | length == 0
  retries: 60
  delay: 10
  ignore_errors: true

- name: Delete LLM Secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: kai-api-keys
    namespace: "{{ mta.instance_namespace }}"
    validate_certs: "{{ cluster_validate_certs }}"
  ignore_errors: true
  no_log: true

- name: Display platform destroy completion
  ansible.builtin.debug:
    msg:
      - "Platform resources destroyed:"
      - "  - Workshop resources"
      - "  - Dev Spaces instance"
      - "  - MTA instance"
      - "  - Solution Server"
      - "  - LLM Secret"
