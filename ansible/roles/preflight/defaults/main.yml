---
# Preflight check defaults
minimum_openshift_version: "4.12"
required_operator_packages:
  - devspaces
  - mta-operator

# Capacity estimation (per user)
per_user_cpu: 0.5  # 500m
per_user_memory: 2  # 2Gi in GB
per_user_storage: 10  # 10Gi in GB

# Platform capacity
platform_cpu: 4  # Dev Spaces + MTA + Solution Server
platform_memory: 16  # GB
platform_storage: 20  # GB
