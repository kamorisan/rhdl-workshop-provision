---
- name: Create Git Secrets for S2I BuildConfigs
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../group_vars/vault.yml

  vars:
    user_count: 10
    user_prefix: "user"
    namespace_suffix: "-dev"
    git_password: "{{ vault_gitea_workshop_password }}"
    secret_name: "gitea-git-secret"

  tasks:
    - name: Create Git Secret in each user namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ secret_name }}"
            namespace: "{{ user_prefix }}{{ '%02d' | format(item) }}{{ namespace_suffix }}"
            labels:
              app.kubernetes.io/managed-by: ansible
              app.kubernetes.io/part-of: workshop-git-secrets
          type: kubernetes.io/basic-auth
          stringData:
            username: "{{ user_prefix }}{{ '%02d' | format(item) }}"
            password: "{{ git_password }}"
      loop: "{{ range(1, user_count + 1) | list }}"
      loop_control:
        label: "{{ user_prefix }}{{ '%02d' | format(item) }}{{ namespace_suffix }}"

    - name: Link secret to builder ServiceAccount
      ansible.builtin.shell: |
        oc secrets link builder {{ secret_name }} \
          -n {{ user_prefix }}{{ '%02d' | format(item) }}{{ namespace_suffix }} \
          --for=mount 2>/dev/null || true
      loop: "{{ range(1, user_count + 1) | list }}"
      loop_control:
        label: "{{ user_prefix }}{{ '%02d' | format(item) }}{{ namespace_suffix }}"
      changed_when: false

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "Git Secrets created successfully"
          - "Secret name: {{ secret_name }}"
          - "Namespaces: {{ user_prefix }}01{{ namespace_suffix }} - {{ user_prefix }}{{ '%02d' | format(user_count) }}{{ namespace_suffix }}"
          - "Type: kubernetes.io/basic-auth"
          - "Linked to: builder ServiceAccount"
