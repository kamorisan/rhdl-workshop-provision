---
- name: Manage Workshop Secrets
  hosts: localhost
  gather_facts: false

  roles:
    - role: llm_secret
      tags: [secrets, llm]

    - role: repository_secret
      tags: [secrets, repository]
      when: demo_repository_private | default(false) | bool

  post_tasks:
    - name: Display secret creation status
      ansible.builtin.debug:
        msg:
          - "LLM Secret created in {{ mta.instance_namespace }}"
          - "Repository Secret created (if private repo)"
      tags: always
